<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FaceLock - Register</title>

   <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">
</head>
<body>

<div class="container">
    <div class="card">

   <h1>📷 Face Registration</h1>
   <!-- Registration Progress Bar -->
<div class="progress-container">
    <div id="progressBar" class="progress-bar">
        0%
    </div>
</div>
<p id="cameraStatus">📷 Camera: Waiting...</p>
<p id="faceStatus">😀 Face Detection: Not Detected</p>
<p id="captureStatus">📸 Capture: Pending</p>
<p id="saveStatus">💾 Save: Pending</p>

<div id="messageBox"></div>
<!-- Camera Section -->
<div class="camera-container">
    <!-- Camera Preview -->
</div>

<div class="input-group">
    <label for="username">Username</label>
    <input
        type="text"
        id="username"
        name="username"
        placeholder="Enter your username"
        required>
</div>

<h3>Camera Preview</h3>
<img id="camera-preview"
     src="{{ url_for('static', filename='images/camera_placeholder.png') }}"
     alt="Camera Preview">
        <br><br>

        <button class="btn">📸 Capture Face</button>

        <button class="btn secondary">✅ Register</button>

        <br><br>

        <a href="/">⬅ Back Home</a>

    </div>
</div>
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
</body>
</html>
<form action="{{ url_for('register') }}" method="POST">

    <div class="input-group">
        <label>Username</label>
        <input type="text" name="username" required>
    </div>

    <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="fullname" required>
    </div>

    <div class="input-group">
        <label>Email</label>
        <input type="email" name="email" required>
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" name="password" required>
    </div>

    <div class="input-group">
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required>
    </div>

    <button type="submit" class="btn">
        Continue →
    </button>

</form>
